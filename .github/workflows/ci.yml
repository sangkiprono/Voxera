name: Voxera CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: voxera
          POSTGRES_USER: voxera
          POSTGRES_PASSWORD: voxera-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxera -d voxera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: voxera
      POSTGRES_USER: voxera
      POSTGRES_PASSWORD: voxera-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
